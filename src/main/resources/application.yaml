spring:
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  application:
    name: symbanta
  datasource:
    url: jdbc:postgresql://localhost:5432/app_db
    username: postgres
    password: postgres_password
    hikari:
      initialization-fail-timeout: 5000
  flyway:
    enabled: true

management:
  otlp:
    metrics:
      export:
        enabled: false
