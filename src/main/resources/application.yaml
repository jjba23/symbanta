spring:
  profiles:
    default: seeder
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  application:
    name: symbanta
  datasource:
    url: jdbc:postgresql://localhost:5432/app_db
    username: postgres
    password: postgres_password
    hikari:
      initialization-fail-timeout: 5000
  flyway:
    enabled: true

management:
  otlp:
    metrics:
      export:
        enabled: false

application:
  user-seeder:
    users:
      - username: admin
        password: password123
        role: ROLE_ADMIN
  property-seeder:
    properties:
      - domain: wikimusic.jointhefreeworld.org
      - domain: jointhefreeworld.org
      # - domain: localhost
      - domain: byggsteg.jointhefreeworld.org
      - domain: lucidplan.jointhefreeworld.org
