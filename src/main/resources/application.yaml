spring:
  profiles:
    default: seeder
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  application:
    name: symbanta
  datasource:
    url: jdbc:postgresql://localhost:5432/app_db
    username: postgres
    password: postgres_password
    hikari:
      initialization-fail-timeout: 5000
  flyway:
    enabled: true
  jpa:
    # Controllers and services never touch entities outside a repository call.
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          # Coalesce the worker's saveAll into multi-row INSERTs.
          batch_size: 500
          time_zone: UTC
        order_inserts: true
        order_updates: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: false

server:
  error:
    include-stacktrace: always

# Request-level framework logging stays at INFO: the web and security packages log several
# lines per request at DEBUG, which costs measurable CPU on the ingestion hot path and floods
# the JSON log. Raise them per environment (LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB=DEBUG) when
# debugging instead of shipping DEBUG to every deployment.
logging:
  level:
    root: INFO


application:
  # Asynchronous ingestion queue (see BatchingEventDispatcher)
  ingestion:
    queue-capacity: 10000
    worker-count: 8
    # Events coalesced into one batched INSERT
    max-batch-size: 500
    # Grace period a worker gives each batch to fill before flushing it, so a few thousand
    # events per second are not written as one transaction per event.
    linger-millis: 10
  # Dashboard reads are full-window aggregates, so a repeated read inside this window is served
  # from memory. Set to 0 to disable the cache and read the store on every call.
  stats:
    cache-ttl: 15s
  user-seeder:
    users: []
      # - username: admin
      #   password: password123
      #   role: ROLE_ADMIN
  property-seeder:
    properties:
      - domain: wikimusic.jointhefreeworld.org
      - domain: jointhefreeworld.org
      # - domain: localhost
      - domain: byggsteg.jointhefreeworld.org
      - domain: lucidplan.jointhefreeworld.org
      - domain: carvoeirowaterfun.com
