openapi: 3.0.3
info:
  title: Symbanta API
  version: 1.0.0
  description: |
    Privacy-friendly, free, and open-source software analytics platform API.
    Designed to collect telemetry and usage metrics without storing Personally Identifiable Information (PII) or using persistent tracking cookies.
  contact:
    name: Symbanta
servers:
  - url: http://localhost:8080
    description: Local Server
  - url: https://api.symbanta.jointhefreeworld.org
    description: Production Server

paths:
  /v1/events/register:
    post:
      summary: Register an event
      description: |
        Ingests a user event or pageview. Server-side processing automatically anonymizes request headers (e.g., IP addresses) and avoids persistent cookies.
      operationId: registerEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V1EventPayload"
      responses:
        "202":
          description: Event successfully accepted and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V1EventResponse"
        "400":
          description: Invalid payload or missing required fields
          content:
            application/problem+detail:
              schema:
                $ref: "#/components/schemas/V1ProblemDetails"
        "401":
          description: Unauthorized domain or token
          content:
            application/problem+detail:
              schema:
                $ref: "#/components/schemas/V1ProblemDetails"

  /v1/stats/summary:
    get:
      summary: Get aggregated site statistics
      description: Retrieve privacy-safe aggregated metrics (e.g., total visitors, views, bounce rate) for a given domain.
      operationId: getStatsSummary
      parameters:
        - name: domain
          in: query
          required: true
          schema:
            type: string
          example: example.com
          description: Registered domain name to fetch metrics for.
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum:
              [
                LAST_24_HOURS,
                LAST_7_DAYS,
                LAST_30_DAYS,
                LAST_6_MONTHS,
                LAST_12_MONTHS,
                CUSTOM,
              ]
            default: LAST_30_DAYS
          description: Time range for aggregated metrics.
        - name: start-date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Required if period is set to `CUSTOM` (YYYY-MM-DD).
        - name: end-date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Required if period is set to `CUSTOM` (YYYY-MM-DD).
      responses:
        "200":
          description: Aggregated statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V1StatsSummaryResponse"
        "401":
          description: Unauthorized dashboard access
          content:
            application/problem+detail:
              schema:
                $ref: "#/components/schemas/V1ProblemDetails"

  /v1/stats/timeseries:
    get:
      summary: Get time-series statistics for chart rendering
      description: Retrieve time-bucketed analytics (hourly or daily) formatted for populating bar/line charts.
      operationId: getTimeSeriesStats
      parameters:
        - name: domain
          in: query
          required: true
          schema:
            type: string
          example: example.com
          description: Registered domain name to fetch metrics for.
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum:
              [
                LAST_24_HOURS,
                LAST_7_DAYS,
                LAST_30_DAYS,
                LAST_6_MONTHS,
                LAST_12_MONTHS,
                CUSTOM,
              ]
            default: LAST_30_DAYS
          description: Time range for metrics aggregation.
        - name: start-date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Required if period is set to `CUSTOM` (YYYY-MM-DD).
        - name: end-date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Required if period is set to `CUSTOM` (YYYY-MM-DD).
      responses:
        "200":
          description: Time-series metrics retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V1TimeSeriesStatsResponse"
        "401":
          description: Unauthorized dashboard access
          content:
            application/problem+detail:
              schema:
                $ref: "#/components/schemas/V1ProblemDetails"

components:
  schemas:
    V1EventPayload:
      type: object
      required:
        - domain
        - name
      properties:
        domain:
          type: string
          example: example.com
          description: Registered domain name.
        name:
          type: string
          example: page-view
          description: Name of the event (e.g., 'page-view', 'signup-click').
        sessionId:
          type: string
          example: 12i3n1ji2inu3-kn12j3n21kjn312-1kn2j3n21k3
          description: Identifier to help distinguish between different sessions and tabs and instances.
        url:
          type: string
          format: uri
          example: https://example.com/blog/privacy-first
          description: Full URL where the event occurred.
        referrer:
          type: string
          format: uri
          example: https://google.com
          description: Referrer URL (if available).
        screenWidth:
          type: integer
          example: 1920
          description: Screen/viewport width in pixels.
        screenHeight:
          type: integer
          example: 1080
          description: Screen/viewport height in pixels.
        language:
          type: string
          example: en-US
          description: Preferred browser language.
        userAgent:
          type: string
          example: Mozilla/110
          description: Browser user agent
        props:
          type: object
          example:
            plan: pro
            theme: dark
          description: Optional key-value metadata (custom properties). Must not contain PII.

    V1EventResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Event queued successfully.

    V1StatsSummaryResponse:
      type: object
      required:
        - pageViews
        - visitors
      properties:
        from:
          type: string
          format: date-time
          example: "2026-08-08T08:49:28Z"
          description: Start timestamp for the aggregated metrics period (inclusive).
        to:
          type: string
          format: date-time
          example: "2026-09-07T08:49:28Z"
          description: End timestamp for the aggregated metrics period (inclusive).
        pageViews:
          type: integer
          example: 12450
        visitors:
          type: integer
          example: 3100
        bounceRate:
          type: number
          format: long
          example: 42.5
          description: Percentage of single-page visits.
        averageDurationMillis:
          type: number
          format: long
          example: 1.84

    V1TimeSeriesStatsResponse:
      type: object
      required:
        - granularity
        - from
        - to
        - points
      properties:
        granularity:
          type: string
          enum: [ HOUR, DAY ]
          example: "DAY"
          description: Time bucket size used for aggregation.
        from:
          type: string
          format: date-time
          example: "2026-08-08T00:00:00Z"
          description: Start timestamp for the queried interval (inclusive).
        to:
          type: string
          format: date-time
          example: "2026-09-07T23:59:59Z"
          description: End timestamp for the queried interval (inclusive).
        points:
          type: array
          items:
            $ref: "#/components/schemas/TimeSeriesPoint"

    TimeSeriesPoint:
      type: object
      required:
        - timestamp
        - pageViews
        - visitors
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-09-07T00:00:00Z"
          description: Beginning timestamp of the time bucket.
        pageViews:
          type: integer
          example: 450
          description: Number of page views recorded within this time bucket.
        visitors:
          type: integer
          example: 120
          description: Distinct session visitors active within this time bucket.

    V1ProblemDetails:
      type: object
      description: Standard RFC 7807 / RFC 9457 Problem Details response object.
      required:
        - type
        - title
      properties:
        type:
          type: string
          format: uri-reference
          default: "about:blank"
          example: "https://api.symbanta.jointhefreeworld.org/v1/errors/invalid-payload"
          description: A URI reference identifying the problem type.
        title:
          type: string
          example: "Invalid Request Payload"
          description: Short, human-readable summary of the problem type.
        detail:
          type: string
          example: "The 'domain' field is required and cannot be empty."
          description: Human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          format: uri-reference
          example: "/v1/events/register"
          description: A URI reference identifying the specific occurrence of the problem.